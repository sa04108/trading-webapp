name: Publish and deploy
run-name: Publish and deploy · ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-platform-production
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout installer tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify Windows PowerShell installer scenarios
        shell: powershell
        run: ./tests/windows/agent-installer.test.ps1

  publish:
    needs: windows-installer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      agent-image: ghcr.io/sa04108/quant-agent@${{ steps.agent-build.outputs.digest }}
      agent-version: ${{ steps.versions.outputs.version }}
      node-version: ${{ steps.versions.outputs.node }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate repository package manager
        run: |
          npm install --global corepack@0.34.6
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate release
        id: versions
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:all
          pnpm build
          pnpm build:agent
          pnpm test:agent-package
          node -e 'const fs=require("node:fs"); const {execFileSync}=require("node:child_process"); const versions=JSON.parse(execFileSync(process.execPath,["scripts/build-runtime-versions.mjs","--print"],{encoding:"utf8"})); fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${versions.agentVersion}\nnode=${fs.readFileSync(".node-version","utf8").trim()}\n`);'
      - name: Set up ARM image builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Build Agent image
        id: agent-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sa04108/quant-agent:v-${{ steps.versions.outputs.version }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            BUILD_GIT_SHA=${{ github.sha }}
            AGENT_VERSION=${{ steps.versions.outputs.version }}
      - name: Verify Agent container
        env:
          AGENT_DIGEST: ${{ steps.agent-build.outputs.digest }}
        run: docker run --rm --init --mount "type=bind,source=$PWD/tests/helpers/container-agent-smoke.mjs,target=/tmp/container-agent-smoke.mjs,readonly" --entrypoint node "ghcr.io/sa04108/quant-agent@$AGENT_DIGEST" /tmp/container-agent-smoke.mjs
      - name: Promote verified Agent alias
        env:
          AGENT_DIGEST: ${{ steps.agent-build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag ghcr.io/sa04108/quant-agent:latest "ghcr.io/sa04108/quant-agent@$AGENT_DIGEST"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, minipc]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      EXPECTED_AGENT_VERSION: ${{ needs.publish.outputs.agent-version }}
      EXPECTED_GIT_SHA: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      # checkout이 기존 운영 설정·상태를 청소하지 못하도록 먼저 경로를 확인한다.
      - name: Verify persistent server directory
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != / ]] || {
            echo 'DEPLOY_PATH에 기존 운영 저장소의 절대 경로를 등록하세요.' >&2
            exit 1
          }
          server_home="$(realpath -e -- "$DEPLOY_PATH")"
          runner_work_home="$(realpath -m -- "$GITHUB_WORKSPACE/../..")"
          temporary_home="$(realpath -m -- "$RUNNER_TEMP")"
          case "$server_home/" in
            "$runner_work_home/"*|"$temporary_home/"*)
              echo '운영 디렉터리는 runner checkout·임시 디렉터리 밖에 두세요.' >&2
              exit 1
              ;;
          esac
          [[ -f "$server_home/config.env" && -w "$server_home" ]] || {
            echo '운영 디렉터리의 config.env와 쓰기 권한을 확인하세요.' >&2
            exit 1
          }
      - name: Checkout verified release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip superseded release
        id: release
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'main이 갱신되어 이전 커밋의 서버 적용을 건너뜁니다.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Find local release image
        if: steps.release.outputs.deploy == 'true'
        id: local-image
        run: |
          set -euo pipefail
          # 이 태그는 컨테이너 검사를 통과한 뒤에만 생성하며 재시도에도 같은 ID를 유지한다.
          if image_id="$(docker image inspect --format '{{.Id}}' "quant-platform:sha-$GITHUB_SHA" 2>/dev/null)"; then
            [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf 'image=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up local server builder
        if: steps.release.outputs.deploy == 'true' && steps.local-image.outputs.image == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: quant-server-build
          # 운영 서버와 같은 PC에서 빌드하므로 빌더 자원을 제한하고 캐시는 재사용한다.
          driver-opts: |
            memory=4g
            cpu-period=100000
            cpu-quota=200000
          keep-state: true
      - name: Build server image locally
        if: steps.release.outputs.deploy == 'true' && steps.local-image.outputs.image == ''
        id: server-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            NODE_VERSION=${{ needs.publish.outputs.node-version }}
            BUILD_GIT_SHA=${{ github.sha }}
            AGENT_CONTAINER_IMAGE=${{ needs.publish.outputs.agent-image }}
      - name: Verify local server container
        if: steps.release.outputs.deploy == 'true'
        env:
          SERVER_IMAGE: ${{ steps.local-image.outputs.image || steps.server-build.outputs.imageid }}
        run: |
          set -euo pipefail
          [[ "$SERVER_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --pull never --rm --init --memory 1g --cpus 1 \
            --env EXPECTED_AGENT_VERSION --env EXPECTED_GIT_SHA \
            --mount "type=bind,source=$PWD/tests/helpers/container-server-smoke.mjs,target=/tmp/container-server-smoke.mjs,readonly" \
            --entrypoint node "$SERVER_IMAGE" /tmp/container-server-smoke.mjs
          docker tag "$SERVER_IMAGE" "quant-platform:sha-$GITHUB_SHA"
      - name: Update server to verified local image
        if: steps.release.outputs.deploy == 'true'
        env:
          SERVER_IMAGE: ${{ steps.local-image.outputs.image || steps.server-build.outputs.imageid }}
        run: |
          set -euo pipefail
          # 빌드 중 main이 변경됐으면 운영 서버를 이전 커밋으로 교체하지 않는다.
          latest_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo 'main이 갱신되어 이전 커밋의 서버 적용을 건너뜁니다.'
            exit 0
          fi
          bash scripts/server.sh update "$SERVER_IMAGE"
          docker tag "$SERVER_IMAGE" quant-platform:local
          bash scripts/server.sh status
