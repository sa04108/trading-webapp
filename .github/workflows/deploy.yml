name: Publish images
run-name: Publish and deploy · ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-platform-production
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout installer tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify Windows PowerShell installer scenarios
        shell: powershell
        run: ./tests/windows/agent-installer.test.ps1

  publish:
    needs: windows-installer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      server-image: ghcr.io/sa04108/quant-platform@${{ steps.server-build.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate repository package manager
        run: |
          npm install --global corepack@0.34.6
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate release
        id: versions
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:all
          pnpm build
          pnpm build:agent
          pnpm test:agent-package
          node -e 'const fs=require("node:fs"); const {execFileSync}=require("node:child_process"); const versions=JSON.parse(execFileSync(process.execPath,["scripts/build-runtime-versions.mjs","--print"],{encoding:"utf8"})); fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${versions.agentVersion}\nnode=${fs.readFileSync(".node-version","utf8").trim()}\n`);'
      - name: Set up ARM image builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Build Agent image
        id: agent-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sa04108/quant-agent:v-${{ steps.versions.outputs.version }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            BUILD_GIT_SHA=${{ github.sha }}
            AGENT_VERSION=${{ steps.versions.outputs.version }}
      - name: Verify Agent container
        env:
          AGENT_DIGEST: ${{ steps.agent-build.outputs.digest }}
        run: docker run --rm --init --mount "type=bind,source=$PWD/tests/helpers/container-agent-smoke.mjs,target=/tmp/container-agent-smoke.mjs,readonly" --entrypoint node "ghcr.io/sa04108/quant-agent@$AGENT_DIGEST" /tmp/container-agent-smoke.mjs
      - name: Build server image
        id: server-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sa04108/quant-platform:sha-${{ github.sha }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            BUILD_GIT_SHA=${{ github.sha }}
            AGENT_CONTAINER_IMAGE=ghcr.io/sa04108/quant-agent@${{ steps.agent-build.outputs.digest }}
      - name: Verify server container
        env:
          SERVER_DIGEST: ${{ steps.server-build.outputs.digest }}
          EXPECTED_AGENT_VERSION: ${{ steps.versions.outputs.version }}
        run: docker run --rm --init --env EXPECTED_AGENT_VERSION --mount "type=bind,source=$PWD/tests/helpers/container-server-smoke.mjs,target=/tmp/container-server-smoke.mjs,readonly" --entrypoint node "ghcr.io/sa04108/quant-platform@$SERVER_DIGEST" /tmp/container-server-smoke.mjs
      - name: Promote verified image aliases
        env:
          AGENT_DIGEST: ${{ steps.agent-build.outputs.digest }}
          SERVER_DIGEST: ${{ steps.server-build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag ghcr.io/sa04108/quant-agent:latest "ghcr.io/sa04108/quant-agent@$AGENT_DIGEST"
          docker buildx imagetools create --tag ghcr.io/sa04108/quant-platform:latest "ghcr.io/sa04108/quant-platform@$SERVER_DIGEST"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, quant-platform]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVER_IMAGE: ${{ needs.publish.outputs.server-image }}
    defaults:
      run:
        shell: bash
    steps:
      # checkout이 기존 운영 설정·상태를 청소하지 못하도록 먼저 경로를 확인한다.
      - name: Verify persistent server directory
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != / ]] || {
            echo 'DEPLOY_PATH에 기존 운영 저장소의 절대 경로를 등록하세요.' >&2
            exit 1
          }
          server_home="$(realpath -e -- "$DEPLOY_PATH")"
          runner_work_home="$(realpath -m -- "$GITHUB_WORKSPACE/../..")"
          temporary_home="$(realpath -m -- "$RUNNER_TEMP")"
          case "$server_home/" in
            "$runner_work_home/"*|"$temporary_home/"*)
              echo '운영 디렉터리는 runner checkout·임시 디렉터리 밖에 두세요.' >&2
              exit 1
              ;;
          esac
          [[ -f "$server_home/config.env" && -w "$server_home" ]] || {
            echo '운영 디렉터리의 config.env와 쓰기 권한을 확인하세요.' >&2
            exit 1
          }
      - name: Checkout verified release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip superseded release
        id: release
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'main이 갱신되어 이전 커밋의 서버 적용을 건너뜁니다.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update server to verified image
        if: steps.release.outputs.deploy == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          # registry 인증은 이번 작업 동안만 보관한다.
          registry_config="$(mktemp -d "$RUNNER_TEMP/quant-ghcr.XXXXXX")"
          trap 'rm -rf -- "$registry_config"' EXIT
          export DOCKER_CONFIG="$registry_config"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          bash scripts/server.sh update "$SERVER_IMAGE"
          bash scripts/server.sh status
