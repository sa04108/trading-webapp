---
# ansible/inventory.yml로 복사하거나 ANSIBLE_INVENTORY로 다른 경로를 지정한다.
# SSH config 또는 ssh-agent를 사용하면 아래 ansible_* 접속 변수는 생략할 수 있다.
all:
  children:
    app:
      hosts:
        app-node:
          ansible_host: app.example.com
          ansible_user: ubuntu
          ansible_port: 22
          ansible_ssh_private_key_file: /absolute/path/to/app.pem
          ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
    worker:
      hosts:
        worker-node:
          ansible_host: worker.example.com
          ansible_user: ubuntu
          ansible_port: 22
          ansible_ssh_private_key_file: /absolute/path/to/worker.pem
          ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
